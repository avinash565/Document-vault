type Collection {
  id: ID!
  name: String!
  slug: String!
  createdAt: String!
  documents: [Document!]!
}

type Document {
  id: ID!
  title: String!
  content: String!
  tags: [String!]!
  isArchived: Boolean!
  createdAt: String!
  collectionId: ID!
  collection: Collection!
}

"""
Cursor-paginated list of documents, following the Relay-style
edges/pageInfo shape so 'take' and 'cursor' map cleanly onto it.
"""
type DocumentConnection {
  edges: [DocumentEdge!]!
  pageInfo: PageInfo!
}

type DocumentEdge {
  cursor: String!
  node: Document!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  collections: [Collection!]!
  collection(id: ID!): Collection

  """
  Search documents by substring match on title or content.
  Optionally filter by collectionId and/or isArchived.
  Cursor-based pagination via take/cursor.
  """
  documents(
    collectionId: ID
    search: String
    isArchived: Boolean
    take: Int = 20
    cursor: String
  ): DocumentConnection!
}

input CreateCollectionInput {
  name: String!
  slug: String!
}

input CreateDocumentInput {
  title: String!
  content: String!
  tags: [String!] = []
  collectionId: ID!
}

input UpdateDocumentInput {
  title: String
  content: String
  tags: [String!]
  isArchived: Boolean
}

type Mutation {
  createCollection(input: CreateCollectionInput!): Collection!

  createDocument(input: CreateDocumentInput!): Document!
  updateDocument(id: ID!, input: UpdateDocumentInput!): Document!
  deleteDocument(id: ID!): Boolean!
  moveDocument(id: ID!, collectionId: ID!): Document!
}
